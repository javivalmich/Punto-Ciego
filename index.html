<style>
:root{
  --acero:#0C0C0C; --casco:#161618; --chapa:#202023; --remache:#303035;
  --tiza:#F3EEE6; --niebla:#9C978F; --baliza:#FF4637; --alarma:#FF4637; --sonar:#9CC4D4; --ok:#63C283;
  --disp:Outfit,"Avenir Next",system-ui,sans-serif;
  --txt:Outfit,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--acero);color:var(--tiza);font-family:var(--txt);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1.08;letter-spacing:-.01em}
h2{font-size:24px}
p{margin:.4em 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--remache);background:var(--chapa);color:var(--tiza);border-radius:10px;padding:12px 14px;min-height:48px;font-weight:600;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active:not([disabled]){filter:brightness(1.18)}
button[disabled]{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--baliza);outline-offset:2px}
input,select{background:var(--casco);border:1px solid var(--remache);border-radius:10px;padding:12px;min-height:48px;width:100%}
input::placeholder{color:#63778a}
.b-baliza{background:var(--tiza);border-color:var(--tiza);color:#0C0C0C}
.b-alarma{background:var(--alarma);border-color:var(--alarma);color:#fff}
.av{border-radius:50%;object-fit:cover;object-position:50% 30%;background:#0f0f0f;flex:0 0 auto;display:inline-block;vertical-align:middle}
.pose{display:block;margin:0 auto;height:auto;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 72%,transparent 100%)}
.pose.rojo{filter:drop-shadow(0 0 18px rgba(255,70,55,.55)) saturate(1.1)}
.pose.gris{filter:grayscale(1) brightness(.7)}
.mira{display:block}
.b-ancho{display:block;width:100%}
.b-link{background:none;border:0;color:var(--niebla);text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:8px 0;font-weight:500}
.b-mini{min-height:34px;padding:4px 10px;font-size:14px;margin-left:auto;background:transparent}
.tenue{color:var(--niebla)}
.lbl{display:block;color:var(--niebla);font-size:14px;margin:0 0 6px}
.fila{display:flex;gap:8px}
.fila input{flex:1;min-width:0}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--acero);border-bottom:1px solid var(--remache)}
.tb{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px}
.marca{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:.06em;display:flex;align-items:center;gap:1px}
.marca i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--tiza);margin:0 5px 0 1px;position:relative}
.marca i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--baliza)}
.tb-cod{font-family:var(--disp);font-size:15px;color:var(--niebla);letter-spacing:.18em;font-weight:600}
.red{width:9px;height:9px;border-radius:50%;background:var(--alarma);flex:0 0 auto}
.red.ok{background:var(--ok)}
.yo{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:600;max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);flex:0 0 auto}

main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
.bloque{margin:18px 0}
.bloque.o{padding-top:18px;border-top:1px solid var(--remache)}

.hero{margin:0 -16px 6px;padding:0 16px;text-align:center}
.hero .logo{width:min(100%,380px);height:auto;display:block;margin:0 auto}
.lema{font-size:16.5px;max-width:34ch;color:#cfc9bf;margin:4px auto 0}
.in-cod{font-family:var(--disp);font-size:24px;letter-spacing:.3em;text-transform:uppercase}

details.reglas{margin:22px 0;border-top:1px solid var(--remache);padding-top:10px}
details.reglas summary{cursor:pointer;font-family:var(--disp);font-size:21px;font-weight:700;padding:6px 0;list-style:none}
details.reglas summary::after{content:" +";color:var(--baliza)}
details[open].reglas summary::after{content:" −"}
.reglas p{color:#c7d1da;max-width:62ch}

.codigo{text-align:center;padding:10px 0 18px;border-bottom:1px solid var(--remache)}
.cod-grande{display:flex;justify-content:center;gap:8px;margin:6px 0 14px}
.cod-grande span{font-family:var(--disp);font-weight:800;font-size:42px;width:52px;height:64px;display:grid;place-items:center;background:var(--casco);border:1px solid var(--remache);border-bottom:3px solid var(--baliza);border-radius:8px}
.b-sec{background:transparent}

ul.gente{list-style:none;margin:10px 0 0;padding:0}
ul.gente li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--remache)}
ul.gente li:first-child{border-top:0}
ul.gente em{font-style:normal;color:var(--niebla);font-size:13.5px}

.sitios{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sitio{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;font-weight:500;background:var(--casco)}
.sitio b{font-family:var(--disp);font-size:19px}
.sitio small{color:var(--niebla);font-size:13px;line-height:1.3}
.sitio.on{border-color:var(--baliza);box-shadow:inset 0 0 0 1px var(--baliza);background:#241312}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{min-height:38px;padding:6px 12px;border-radius:999px;font-weight:500;font-size:14.5px;background:transparent;color:var(--niebla)}
.chip.on{background:var(--tiza);border-color:var(--tiza);color:var(--acero)}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.add select{grid-column:1/2}
.add button{grid-row:1/3;grid-column:2}
.paso{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--remache)}
.paso:first-of-type{border-top:0}
.paso .ctl{display:flex;align-items:center;gap:6px}
.paso .ctl b{min-width:58px;text-align:center;font-family:var(--disp);font-size:20px}
.paso .ctl button{width:44px;min-height:44px;padding:0;font-size:20px}
.tog{min-width:74px;min-height:40px;padding:4px 10px;border-radius:999px}
.tog.on{background:var(--ok);border-color:var(--ok);color:#0d2416}
.motivo{color:var(--baliza);font-size:14.5px;margin:8px 0}

.barra-t{margin:4px 0 14px}
.bt-cab{display:flex;justify-content:space-between;font-size:14px;color:var(--niebla)}
.bt-cab b{color:var(--tiza);font-family:var(--disp);font-size:18px}
.bt{height:12px;background:var(--casco);border:1px solid var(--remache);border-radius:3px;overflow:hidden;margin-top:4px}
.bt i{display:block;height:100%;background:var(--ok);transition:width .6s ease}
.rol-b{display:block;width:100%;text-align:left;background:var(--casco);font-weight:500;color:var(--niebla)}
.rol-b.ver{color:var(--tiza)}
.rol-b.ver.imp{border-color:var(--alarma);background:#2a1110}
.rol-b.ver b{font-family:var(--disp);font-size:22px}
.fantasma{border:1px dashed var(--sonar);color:var(--sonar);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}

.alerta{margin:12px 0;border-radius:10px;overflow:hidden;background:#221110;border:1px solid var(--alarma);border-top-width:4px}
.alerta .in{padding:12px}
.alerta h3{font-size:26px;display:flex;justify-content:space-between;gap:10px}
.alerta h3 span{color:var(--baliza)}
.alerta .fila{margin-top:8px;flex-wrap:wrap}
.alerta .fila button{flex:1;min-width:140px}
.panel-est{font-size:14px;color:var(--niebla);margin:2px 0}
.cerrada{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--casco);border-left:4px solid var(--baliza);font-size:15px}

ul.tareas{list-style:none;margin:6px 0;padding:0;display:grid;gap:8px}
.tarea{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--casco);padding:12px 14px;font-weight:400}
.t-sala{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--baliza)}
.t-txt{grid-column:1/2;color:#d3dbe2}
.t-parte{grid-column:2;grid-row:1;font-size:13px;color:var(--niebla);align-self:center}
.tarea.hecha{opacity:.5}
.tarea.hecha .t-sala{color:var(--ok)}
.tarea.hecha .t-txt{text-decoration:line-through}
.coms{margin:14px 0;padding:16px;border-radius:10px;background:repeating-linear-gradient(0deg,#1f2c38 0 3px,#243341 3px 6px);color:var(--niebla);text-align:center}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--casco);border-top:1px solid var(--remache);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.barra{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:8px}
.barra button{padding:10px 8px}

.apagon{position:fixed;inset:0;z-index:20;background:#05080b;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:24px}
.apagon h2{font-size:44px;color:#4a5866}
.apagon p{color:#5d6d7c;max-width:28ch}

#over{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--acero)}
.ov{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(110px + env(safe-area-inset-bottom,0px));min-height:100%}
.ov-franja{height:3px;background:var(--baliza);margin:0 -18px 18px}
.ov .pose{margin:4px auto 6px}
.ov h1{font-size:clamp(46px,14vw,72px);font-weight:800}
.ov .sub{font-size:18px;color:#c7d1da}
.ov .fase{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;font-family:var(--disp);font-size:24px;font-weight:700}
.ov .fase b{color:var(--baliza);font-size:30px}
.dondes{margin:14px 0;padding:12px 14px;border-radius:10px;background:var(--casco);font-size:17px}
.dondes b{color:var(--baliza)}
.votos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.voto{display:flex;align-items:center;gap:10px;text-align:left;background:var(--casco);min-height:56px;padding:10px 14px;border:1px solid var(--remache);border-radius:10px;font-weight:600}
.voto.muerto{opacity:.35;text-decoration:line-through}
.voto .n{margin-left:auto;font-family:var(--disp);font-size:20px;color:var(--baliza)}
.salta{grid-column:1/-1;background:transparent}
.ov-muerto{background:#1a0808;min-height:100vh}
.ov-muerto h1{color:#ff8f86}
.revela{margin-top:26px;border-radius:14px;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;padding:22px;border:1px solid var(--remache);background:var(--casco);width:100%}
.revela.tapa{background:var(--casco);border:1px dashed var(--remache)}
.revela.tapa span{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:.02em}
.mira-caja{position:relative;width:210px;height:210px}
.mira-caja .mira{position:absolute;inset:0}
.mira-caja .pose{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px}
.revela h1{font-size:60px}
.revela.imp{background:#1f0d0c;border-color:var(--alarma)}
.revela.imp h1{color:#ff8f86}
.fin-w{font-size:clamp(50px,15vw,84px)}
.fin-w.imp{color:#ff8f86}
.fin-w.crew{color:var(--ok)}
.roles li{justify-content:flex-start}
.roles .imp{color:#ff8f86;font-weight:600}
.log{font-size:14px;color:var(--niebla)}

#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.sh-fondo{position:absolute;inset:0;background:rgba(5,8,12,.65)}
.sh-caja{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--acero);border-top:3px solid var(--tiza);border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
#shBody{max-width:560px;margin:0 auto}
.sh-sala{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--baliza);margin:0}
.sh-caja h2{margin:4px 0 6px;font-size:28px}
.sh-cerrar{position:absolute;right:12px;top:10px;min-height:40px;width:40px;padding:0;background:transparent;border:0;font-size:20px;color:var(--niebla)}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.gente-b{display:flex;align-items:center;gap:10px;text-align:left;background:var(--casco);font-weight:600}
.opc{display:block;width:100%;text-align:left;margin:8px 0;background:var(--casco);font-weight:400}
.opc b{display:block;font-family:var(--disp);font-size:20px}
.opc small{color:var(--niebla)}
.info-salas{margin-top:18px;padding-top:12px;border-top:1px solid var(--remache);font-size:15px;color:var(--niebla)}
.info-salas b{color:var(--tiza)}

#juego{margin-top:14px}
.g-ayuda{color:var(--niebla);font-size:15px}
.g-rej{display:grid;gap:8px;margin:10px auto;max-width:330px}
.g3{grid-template-columns:repeat(3,1fr)}
.g-c{aspect-ratio:1;min-height:0;font-family:var(--disp);font-size:26px;background:var(--casco);transition:background .12s}
.g-c.on{background:var(--tiza);border-color:var(--tiza)}
.g-c.hecho{background:var(--ok);border-color:var(--ok);color:#0d2416}
.g-c.mal,.g-n.mal{background:var(--alarma)!important}
.g-hold{position:relative;overflow:hidden;width:100%;min-height:120px;font-family:var(--disp);font-size:26px;background:var(--casco);touch-action:none;user-select:none;-webkit-user-select:none}
.g-hold span{position:relative;z-index:1;pointer-events:none}
.g-hold i{position:absolute;inset:0;background:var(--ok);transform:scaleX(0);transform-origin:left;pointer-events:none}
.g-cables{position:relative;display:flex;justify-content:space-between;padding:6px 0;max-width:330px;margin:10px auto}
.g-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.g-col{display:flex;flex-direction:column;gap:14px}
.g-n{width:62px;min-height:44px;padding:0;background:var(--c);border:3px solid rgba(0,0,0,.35)}
.g-n.sel{outline:3px solid var(--tiza);outline-offset:2px}
.g-n.hecho{opacity:.55}
.g-cal{position:relative;height:56px;margin:16px 0 6px;background:var(--casco);border:1px solid var(--remache);border-radius:8px;overflow:hidden}
.g-zona{position:absolute;top:0;bottom:0;background:rgba(79,191,122,.45);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.g-aguja{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--tiza)}
.g-aguja.mal{background:var(--alarma)}
.g-cuenta{text-align:center;font-family:var(--disp);font-size:20px;margin:6px 0 10px}
.g-lector{position:relative;height:74px;border-radius:12px;background:var(--casco);border:1px solid var(--remache);margin:16px 0 4px;overflow:hidden}
.g-lector::after{content:"";position:absolute;right:10px;top:12px;bottom:12px;width:6px;border-radius:3px;background:var(--remache)}
.g-tarjeta{position:absolute;left:6px;top:6px;width:96px;height:60px;border-radius:8px;background:var(--tiza);color:#0C0C0C;display:grid;place-items:center;font-size:30px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.g-pantalla{text-align:center;font-family:var(--disp);font-size:46px;letter-spacing:.35em;padding:10px;margin:8px auto;max-width:330px;border-radius:8px;background:#0e151c;color:var(--ok);min-height:78px}
.g-teclas .g-c{aspect-ratio:auto;min-height:56px}
.hecho-ok{text-align:center;font-family:var(--disp);font-size:38px;color:var(--ok);padding:30px 0}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--tiza);color:var(--acero);padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}

#wkFab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:45;width:62px;height:62px;border-radius:50%;padding:0;background:var(--tiza);border-color:var(--tiza);color:#0C0C0C;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#wkFab.solo{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#wkFab b{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--alarma);color:#fff;font-size:13px;display:grid;place-items:center;padding:0 6px}
#wkFab[hidden],#wkFab b[hidden]{display:none}
#wkTalk{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:55;background:var(--tiza);color:#0C0C0C;font-weight:600;padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.4);white-space:nowrap}
#wkTalk[hidden]{display:none}
#wk{position:fixed;inset:0;z-index:48}
#wk[hidden]{display:none}
.wk-caja{position:absolute;left:0;right:0;bottom:0;height:min(82vh,680px);display:flex;flex-direction:column;background:var(--acero);border-top:3px solid var(--tiza);border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.wk-caja>*{max-width:560px;width:100%;margin-left:auto;margin-right:auto}
.wk-cab{display:flex;justify-content:space-between;align-items:flex-start}
.wk-cab p{margin:2px 0 0;color:var(--niebla);font-size:14.5px}
.wk-cab button{background:transparent;border:0;min-height:40px;width:40px;padding:0;font-size:20px;color:var(--niebla)}
#wkLista{flex:1;overflow:auto;margin:10px auto;padding-right:2px}
.wk-m{padding:7px 0;border-top:1px solid var(--casco);font-size:15px}
.wk-m b{margin-right:6px}
.wk-m.g{color:var(--sonar)}
.wk-m button{min-height:32px;padding:2px 10px;font-size:14px;border-radius:999px;background:transparent}
.wk-vacio{color:var(--niebla);font-size:14.5px}
.wk-escribe{display:flex;gap:8px}
.wk-escribe input{flex:1;min-width:0}
#wkPtt{position:relative;overflow:hidden;margin-top:10px;min-height:76px;border-radius:14px;background:var(--casco);border:2px solid var(--tiza);font-family:var(--disp);font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wkPtt.on{background:var(--baliza);border-color:var(--baliza);color:#fff}
#wkPtt *{pointer-events:none}
#wkNivel{position:absolute;left:0;bottom:0;height:6px;width:100%;background:var(--tiza);transform:scaleX(0);transform-origin:left}
#wkEstado{font-size:14px;color:var(--tiza);margin:8px auto 0;min-height:20px}
#wkDiag{font-size:12.5px;color:var(--niebla);margin:2px auto 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.espera{display:flex;align-items:center;gap:14px}
.espera .pose{width:92px;margin:0;flex:0 0 auto}
.fantasma{display:flex;gap:12px;align-items:center}
.fantasma .pose{width:54px;margin:0;opacity:.75;flex:0 0 auto}
.wk-vacio .pose{width:96px;margin:10px auto}
.portada{text-align:center;padding-top:4px}
.portada .logo{width:min(100%,360px);height:auto;display:block;margin:0 auto}
.rasgos{list-style:none;padding:0;margin:4px auto 22px;max-width:360px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--remache);border:1px solid var(--remache);border-radius:12px;overflow:hidden;text-align:left}
.rasgos li{background:var(--acero);padding:12px 14px;font-size:14px;color:var(--niebla);line-height:1.3}
.rasgos b{display:block;color:var(--tiza);font-size:17px;margin-bottom:2px}
.b-jugar{display:block;width:100%;max-width:360px;margin:0 auto;min-height:62px;font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.12em;background:var(--baliza);border-color:var(--baliza);color:#fff;border-radius:14px}
.perfil{display:flex;align-items:center;gap:16px;padding:6px 0 18px;border-bottom:1px solid var(--remache)}
.perfil h2{font-size:30px;margin:0 0 10px;word-break:break-word}
.pf-fig,.ed-vista{position:relative;flex:0 0 auto}
.pf-fig{width:150px;height:150px}
.pf-fig .mira,.ed-vista .mira{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.pf-fig .pose{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px}
.ed-pegado{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:5;background:var(--acero);margin:0 -16px;padding:4px 16px 10px;border-bottom:1px solid var(--remache)}
.ed-vista{width:190px;height:190px;margin:4px auto 8px}
.ed-vista .pose{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px}
.giros{display:flex;gap:6px;overflow-x:auto;justify-content:safe center;scrollbar-width:none}
.giros .chip{flex:0 0 auto;min-height:34px;padding:4px 12px}
.b-peq{min-height:40px;padding:6px 14px;font-size:15px}
.ed-fila{margin:14px 0}
.ed-fila .lbl b{color:var(--tiza);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--c);border:2px solid var(--remache);font-size:18px;color:var(--tiza)}
.sw.on{border-color:var(--tiza);box-shadow:0 0 0 3px var(--acero),0 0 0 5px var(--baliza)}
.pestanas{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:18px 0 6px;border:1px solid var(--remache);border-radius:12px;overflow:hidden}
.pestanas button{border:0;border-radius:0;background:transparent;color:var(--niebla)}
.pestanas button.on{background:var(--tiza);color:var(--acero)}
.aviso-ok{color:var(--ok);font-size:15px}
.clave{position:relative;display:block}
.clave input{padding-right:84px}
.clave .ver{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:auto;min-height:44px;padding:0 14px;background:none;border:0;color:var(--niebla);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.b-google{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--casco);color:var(--tiza)}
.b-google svg{flex:0 0 auto}
.o-sep{display:flex;align-items:center;gap:12px;color:var(--niebla);font-size:14px;margin:14px 0 4px}
.o-sep::before,.o-sep::after{content:'';flex:1;height:1px;background:var(--remache)}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--niebla);font-size:15px;margin:14px 0 0}
.stats b{color:var(--tiza);font-size:22px;margin-right:4px}
.sep{margin:0 4px}
.pie{font-size:13.5px}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="bar" hidden></nav>
<div id="over" hidden></div>
<div id="sheet" hidden><div class="sh-fondo" data-a="cerrarSheet"></div><div class="sh-caja"><button class="sh-cerrar" data-a="cerrarSheet" aria-label="Cerrar">✕</button><div id="shBody"></div></div></div>
<button id="wkFab" hidden aria-label="Walkie">📻<b id="wkBadge" hidden>0</b></button>

<section id="wk" hidden>
  <div class="sh-fondo" id="wkFondo"></div>
  <div class="wk-caja">
    <header class="wk-cab"><div><h2>Walkie</h2><p id="wkCanal"></p></div><button id="wkCerrar" aria-label="Cerrar walkie">✕</button></header>
    <div id="wkLista"></div>
    <div class="wk-escribe"><input id="wkTxt" maxlength="200" placeholder="Escribe un mensaje" autocomplete="off"><button id="wkEnviar">Enviar</button></div>
    <button id="wkPtt"><span id="wkPttTxt">Mantén para hablar</span><i id="wkNivel"></i></button>
    <p id="wkEstado"></p>
    <p id="wkDiag"></p>
  </div>
</section>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function uid(n=10){const a=crypto.getRandomValues(new Uint8Array(n));let s='';for(const b of a)s+='abcdefghijkmnpqrstuvwxyz23456789'[b&31];return s}
function codigoNuevo(){const a=crypto.getRandomValues(new Uint8Array(5));let s='';for(const b of a)s+=ALF[b&31];return s}
function barajar(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const LS={get(k,d=null){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function mmss(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function deb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const vibra=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}

/* ============ cifrado y MQTT ============ */
async function claves(code){
  const te=new TextEncoder();
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode('impostor-irl/'+code)));
  const topic='impirl2/'+[...h.slice(0,10)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const base=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('impostor-irl-sal'),iterations:60000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  return {topic,key};
}
async function cifra(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},NET.key,new TextEncoder().encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out;
}
async function descifra(buf){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},NET.key,buf.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
const mstr=s=>{const b=new TextEncoder().encode(s);return [b.length>>8,b.length&255,...b]};
function packet(h,parts){
  const tot=parts.reduce((a,p)=>a+p.length,0);let len=tot;const lb=[];
  do{let d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d)}while(len>0);
  const out=new Uint8Array(1+lb.length+tot);out[0]=h;out.set(lb,1);let o=1+lb.length;
  for(const p of parts){out.set(p,o);o+=p.length}return out;
}
class Mq{
  constructor(url,onMsg,onState){
    const m=url.match(/^(wss?:\/\/)([^:@\/]+):([^@\/]+)@(.*)$/);
    if(m){this.user=m[2];this.pass=m[3];url=m[1]+m[4]}
    this.url=url;this.onMsg=onMsg;this.onState=onState;this.up=false;this.st='conectando';this.subs=[];this.tries=0;this.dead=false;
    this.label=url.replace(/^wss?:\/\//,'').split(/[\/:]/)[0].replace(/^(broker|public\.cloud|mqtt)\./,'');
    this.connect();
  }
  connect(){
    if(this.dead)return;let ws;
    try{ws=new WebSocket(this.url,['mqtt'])}catch(e){this.st='error';this.onState(this);return this.retry()}
    this.ws=ws;ws.binaryType='arraybuffer';this.buf=new Uint8Array(0);this.opened=false;this.st='conectando';
    clearTimeout(this.tmo);
    this.tmo=setTimeout(()=>{if(!this.up){this.st=this.opened?'no contesta':'sin respuesta';this.onState(this);try{ws.close()}catch(e){}}},8000);
    ws.onopen=()=>{this.opened=true;
      const body=[...mstr('MQTT'),4,this.user?0xC2:0x02,0,30,...mstr('ip'+uid(10)),...(this.user?[...mstr(this.user),...mstr(this.pass)]:[])];
      ws.send(packet(0x10,[new Uint8Array(body)]))};
    ws.onmessage=e=>this.feed(new Uint8Array(e.data));
    ws.onclose=()=>{if(ws!==this.ws)return;clearInterval(this.ping);clearTimeout(this.tmo);
      if(this.up){this.up=false;this.st='se cortó'}else if(this.st==='conectando')this.st='sin respuesta';
      this.onState(this);this.retry()};
    ws.onerror=()=>{};
  }
  retry(){if(this.dead)return;this.tries++;clearTimeout(this.rt);this.rt=setTimeout(()=>this.connect(),Math.min(15000,1000*2**Math.min(this.tries,4)))}
  despierta(){if(this.dead||this.up)return;if(this.ws&&this.ws.readyState<2)return;clearTimeout(this.rt);this.tries=0;this.connect()}
  feed(chunk){
    let b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);
    while(b.length>=2){
      let mul=1,len=0,i=1,byte,falta=false;
      do{if(i>=b.length){falta=true;break}byte=b[i++];len+=(byte&127)*mul;mul*=128}while(byte&128);
      if(falta||b.length<i+len)break;
      this.handle(b[0]>>4,b[0]&15,b.subarray(i,i+len));
      b=b.slice(i+len);
    }
    this.buf=b;
  }
  handle(type,flags,body){
    if(type===2){
      if(body[1]!==0){this.st='rechazado';this.onState(this);return}
      this.up=true;this.tries=0;this.st='ok';clearTimeout(this.tmo);clearInterval(this.ping);
      this.ping=setInterval(()=>this.send(new Uint8Array([0xC0,0])),20000);
      for(const t of this.subs)this.sendSub(t);
      this.onState(this);
    }else if(type===3){
      const tl=(body[0]<<8)|body[1];const topic=new TextDecoder().decode(body.subarray(2,2+tl));
      let o=2+tl;if((flags>>1)&3)o+=2;
      this.onMsg(topic,body.slice(o));
    }
  }
  send(p){try{if(this.ws&&this.ws.readyState===1){this.ws.send(p);return true}}catch(e){}return false}
  sendSub(t){this.send(packet(0x82,[new Uint8Array([0,1,...mstr(t),0])]))}
  sub(t){this.subs.push(t);if(this.up)this.sendSub(t)}
  pub(topic,payload,retain){if(!this.up)return false;return this.send(packet(0x30|(retain?1:0),[new Uint8Array(mstr(topic)),payload]))}
  close(){this.dead=true;clearInterval(this.ping);clearTimeout(this.rt);clearTimeout(this.tmo);try{this.ws&&this.ws.close()}catch(e){}}
}

const NET={cons:[],topic:null,key:null,seen:new Map()};
async function netStart(code){
  netStop();const k=await claves(code);NET.topic=k.topic;NET.key=k.key;
  NET.cons=BROKERS.map(u=>{const m=new Mq(u,onRaw,c=>{if(c.up&&soyHost())publicarEstado(false);pintaTop();WK.diag()});m.sub(NET.topic+'/#');return m});
}
function netStop(){NET.cons.forEach(c=>c.close());NET.cons=[];NET.key=null}
const redOk=()=>NET.cons.filter(c=>c.up).length;
async function enviar(sub,obj,retain){
  if(!NET.key)return 0;const p=await cifra(obj);let ok=0;
  for(const c of NET.cons)if(c.pub(NET.topic+'/'+sub,p,retain))ok++;return ok;
}
function yaVisto(id){
  if(NET.seen.has(id))return true;NET.seen.set(id,Date.now());
  if(NET.seen.size>3000){const lim=Date.now()-180000;for(const [k,t] of NET.seen)if(t<lim)NET.seen.delete(k)}
  return false;
}
async function onRaw(topic,payload){
  if(!payload.length||!NET.key||!topic.startsWith(NET.topic+'/'))return;
  const sub=topic.slice(NET.topic.length+1);let m;
  try{m=await descifra(payload)}catch(e){return}
  if(sub==='s')recibeEstado(m);
  else if(sub==='a'){if(!yaVisto(m.id))recibeAccion(m)}
  else if(sub==='v'){if(!yaVisto(m.id))WK.recibe(m)}
}

    if(!pool.length)pool=TAREAS.generica.map((t,i)=>[t,'g'+i]).filter(x=>!usadas.has(r.id+x[1]));

  case 'emerg':
    if(st.phase!=='play'||!p||p.dead||!(p.emerg>0))return true;
    if(st.sab&&st.sab.crit){st.notice={pid:p.id,t:now,txt:'No se puede convocar con la fuga de gas activa'};return true}
    p.emerg--;reunion(st,now,p.id,null);return true;
  case 'vote':{
    const m=st.meet;if(st.phase!=='meeting'||!m||m.fase!=='vote'||!p||p.dead||(p.id in m.votes))return true;
    const tg=a.target==='skip'?'skip':(P(st,a.target)&&!P(st,a.target).dead?a.target:null);if(!tg)return true;
    m.votes[p.id]=tg;
    if(st.players.filter(x=>!x.dead).every(x=>x.id in m.votes))resolver(st,now);
    return true;
  }
  case 'sab':{
    if(st.phase!=='play'||!p||p.role!=='imp'||now<st.sabCd)return true;
    const rooms=salas(st);
    if(a.kind==='door'){
      const r=rooms.find(x=>x.id===a.room);if(!r)return true;
      st.locks=st.locks.filter(l=>l.room!==r.id);st.locks.push({room:r.id,until:now+20000});st.sabCd=now+20000;
      st.log.push({t:now,txt:`${p.name} cerró ${r.name}`});return true;
    }
    if(st.sab||!(a.kind in SABS))return true;
    const rs=barajar(rooms.slice());
    if(a.kind==='gas'){if(rs.length<2)return true;st.sab={kind:'gas',crit:true,until:now+60000,rooms:[rs[0].id,rs[1].id],fix:{}}}
    else st.sab={kind:a.kind,rooms:[rs[0].id],fix:{}};
    st.sabCd=now+35000;st.log.push({t:now,txt:`${p.name} saboteó: ${SABS[a.kind].n}`});return true;
  }
  case 'fix':{
    if(st.phase!=='play'||!st.sab||!p||p.dead)return true;
    if(st.sab.kind==='gas'){
      const i=a.panel===1?1:0;st.sab.fix[i]={t:now,pid:p.id};
      const f0=st.sab.fix[0],f1=st.sab.fix[1];
      if(f0&&f1&&Math.abs(f0.t-f1.t)<8000&&f0.pid!==f1.pid){st.sab=null;st.log.push({t:now,txt:'Fuga de gas reparada'})}
    }else{st.log.push({t:now,txt:`${p.name} reparó: ${SABS[st.sab.kind].n}`});st.sab=null}
    return true;
  }
  case 'chat':{
    if(!p)return true;const txt=String(a.txt||'').trim().slice(0,200);if(!txt)return true;
    if(p.dead&&p.body&&st.phase==='play')return true;
    if(!p.dead&&st.phase==='play'&&((st.sab&&st.sab.kind==='coms')||!st.cfg.walkie))return true;
    st.chat.push({id:a.id,t:now,pid:p.id,ch:p.dead?'g':'v',txt});if(st.chat.length>60)st.chat=st.chat.slice(-60);return true;
  }
  }
  return true;
}
function tick(st,now){
  let ch=false;
  if(st.notice&&now-st.notice.t>5000){st.notice=null;ch=true}
  if(st.phase==='play'){
    const n=st.locks.length;st.locks=st.locks.filter(l=>l.until>now);if(st.locks.length!==n)ch=true;
    if(st.sab&&st.sab.kind==='gas')for(const i of [0,1]){const f=st.sab.fix[i];if(f&&now-f.t>=8000){delete st.sab.fix[i];ch=true}}
    if(st.sab&&st.sab.crit&&now>=st.sab.until){st.phase='end';st.end={w:'imp',why:'Nadie ha parado la fuga de gas a tiempo',t:now};st.sab=null;ch=true}
  }else if(st.phase==='meeting'&&st.meet){
    const m=st.meet;
    if(m.fase==='disc'&&now>=m.until){m.fase='vote';m.until=now+st.cfg.vote*1000;ch=true}
    else if(m.fase==='vote'&&now>=m.until){resolver(st,now);ch=true}
    else if(m.fase==='res'&&now>=m.until){
      st.phase='play';st.players.forEach(p=>{if(p.role==='imp')p.kcd=now+st.cfg.killCd*1000});
      st.sabCd=Math.max(st.sabCd,now+15000);ganador(st,now);ch=true;
    }
  }
  return ch;
}

/* ============ red de la partida ============ */
function publicarEstado(bump){
  if(!S||!soyHost())return;
  if(bump)S.v++;S.hb=ahora();
  const me=mine();if(me)me.seen=S.hb;
  LS.set('imp.st.'+ME.code,S);
  if(Date.now()<HOST_PAUSA)return;
  enviar('s',S,true);
}
function mejor(st,cur){
  if(!cur)return true;
  if(st.v>cur.v)return true;
  return st.v===cur.v&&st.hostId===cur.hostId&&st.hb>cur.hb;
}
function recibeEstado(st){
  if(!st||!Array.isArray(st.players))return;
  if(!mejor(st,S))return;
  const eraHost=soyHost(),otroHost=!S||S.hostId!==st.hostId;
  S=st;
  if(S.hostId===ME.pid){if(!eraHost)HECHAS=new Set(S.ackd||[])}
  else{
    if(otroHost)OFFS=[];
    OFFS.push(st.hb-Date.now());if(OFFS.length>12)OFFS.shift();OFF=Math.max(...OFFS);
  }
  for(const id of PEND.keys())if((S.ackd||[]).includes(id))PEND.delete(id);
  for(const k of [...OPT]){const [tid,step]=k.split(':');const t=mine()&&(mine().tasks||[]).find(x=>x.id===tid);if(!t||t.done>+step)OPT.delete(k)}
  if(!mine()&&S.phase==='lobby'&&!JOIN_SENT&&ME.name){JOIN_SENT=true;accion('join',{name:ME.name,look:PERFIL?PERFIL.look:LOOK0})}
  LS.set('imp.st.'+ME.code,S);
  eventos();pinta();
}
function recibeAccion(a){
  if(!soyHost()||!a||!a.id||HECHAS.has(a.id))return;
  aplicar(a);
}
function aplicar(a){
  HECHAS.add(a.id);
  const pub=reducir(S,a,ahora());
  if(a.t==='ping'||pub===false)return;
  S.ackd=[...(S.ackd||[]).slice(-90),a.id];
  publicarEstado(true);eventos();pinta();
}
function accion(t,data={}){
  const a={id:uid(12),pid:ME.pid,t,...data};
  if(soyHost()){aplicar(a);return}
  PEND.set(a.id,{a,n:0});enviar('a',a);
}
setInterval(()=>{
  for(const [id,p] of PEND){if(++p.n>25){PEND.delete(id);continue}if(p.n%2===0)enviar('a',p.a)}
},1000);
setInterval(()=>{if(S&&mine()&&!soyHost())enviar('a',{id:uid(12),pid:ME.pid,t:'ping'})},8000);
setInterval(()=>{if(soyHost()&&tick(S,ahora())){publicarEstado(true);eventos()}},400);
setInterval(()=>{if(soyHost())publicarEstado(false)},4000);
setInterval(()=>{ /* si el anfitrión desaparece, otro coge el mando */
  if(!S||soyHost()||!NET.key||!mine())return;
  const stale=ahora()-S.hb;if(stale<15000)return;
  const cand=S.players.filter(p=>p.id!==S.hostId&&ahora()-(p.seen||0)<60000).map(p=>p.id).sort();
  let r=cand.indexOf(ME.pid);if(r<0)r=cand.length;
  if(stale>15000+r*8000){S.hostId=ME.pid;S.v+=10;HECHAS=new Set(S.ackd||[]);publicarEstado(true);toast('El anfitrión se ha desconectado: ahora llevas tú la partida');pinta()}
},1000);

/* ============ sonidos y avisos ============ */
function tono(seq){
  const c=WK.ctx();if(!c)return;let t=c.currentTime+0.02;
  for(const [f,d,type='square',v=0.1] of seq){
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.03);t+=d;
  }
}
const SON={
  reunion:()=>tono([[880,.16],[620,.16],[880,.16],[620,.16],[880,.3]]),
  sabotaje:()=>tono([[230,.32,'sawtooth',.12],[170,.32,'sawtooth',.12],[230,.32,'sawtooth',.12],[170,.4,'sawtooth',.12]]),
  muerte:()=>tono([[150,.45,'sine',.35],[80,.7,'sine',.35]]),
  tarea:()=>tono([[660,.08,'triangle',.15],[990,.16,'triangle',.15]]),
  fin:()=>tono([[523,.14,'triangle',.18],[659,.14,'triangle',.18],[784,.34,'triangle',.18]])
};
function eventos(){
  if(!S||!ME.pid)return;const p=mine(),pr=PREV;
  PREV={phase:S.phase,mn:S.meet?S.meet.n:0,sab:S.sab?S.sab.kind+S.sab.rooms.join():'',dead:!!(p&&p.dead),gid:S.gid,notice:S.notice?S.notice.t:0};
  if(pr&&pr.gid!==S.gid&&S.phase!=='lobby'){if(WK.abierto)WK.cerrar();cerrarSheet()}
  if(!pr||pr.gid!==S.gid)return;
  if(S.phase==='meeting'&&pr.mn!==PREV.mn){SON.reunion();vibra([300,120,300,120,300]);cerrarSheet();if(WK.abierto)WK.cerrar()}
  if(PREV.sab&&PREV.sab!==pr.sab&&p&&p.role!=='imp'){SON.sabotaje();vibra([500,200,500])}
  if(p&&PREV.dead&&!pr.dead&&S.phase==='play'){SON.muerte();vibra(900);cerrarSheet()}
  if(S.phase==='end'&&pr.phase!=='end'){SON.fin();cerrarSheet();sumarPartida()}
  if(S.notice&&S.notice.pid===ME.pid&&PREV.notice!==pr.notice)toast(S.notice.txt);
}

    return txt.concat(voz).sort((a,b)=>a.t-b.t).slice(-80);
  },
  pinta(){
    const p=mine(),fab=$('#wkFab');fab.hidden=!(S&&p&&ME.code);
    const els=this.elementos();
    if(this.abierto)this.visto=ahora();
    const nuevos=els.filter(e=>e.t>this.visto&&e.pid!==ME.pid).length;
    const bd=$('#wkBadge');bd.hidden=!nuevos;bd.textContent=nuevos;
    if(!this.abierto)return;
    const ch=p&&p.dead?'Canal de fantasmas: oyes a los vivos pero ellos no te oyen':'Canal de todos';
    $('#wkCanal').textContent=ch;
    const no=this.noPuede();if(!this.rec){if(no)this.estado(no);else if(this._no)this.estado('')}this._no=no;
    $('#wkPtt').disabled=!!no&&!this.rec;$('#wkEnviar').disabled=!!no;$('#wkTxt').disabled=!!no;
    const h=els.length?els.map(e=>{const q=P(S,e.pid)||{color:0,name:'?'};const nom=`${dot(q)} <b>${esc(q.name)}</b>`;
      return e.txt!==undefined?`<div class="wk-m ${e.ch}">${nom}${esc(e.txt)}</div>`:`<div class="wk-m ${e.ch}">${nom}<button data-a="wkPlay" data-i="${e.voz}">▶ ${Math.max(1,Math.round(e.dur||0))} s</button></div>`}).join('')
      :'<p class="wk-vacio">'+pose('movil',96)+'Aún no ha hablado nadie. Mantén el botón para hablar o escribe abajo.</p>';
    const L=$('#wkLista');if(L._h!==h){const abajo=L.scrollHeight-L.scrollTop-L.clientHeight<40;L._h=h;L.innerHTML=h;if(abajo||!L._ini){L.scrollTop=L.scrollHeight;L._ini=true}}
  },
  abrir(){this.abierto=true;$('#wk').hidden=false;this.ctx();this.diag();$('#wkLista')._ini=false;this.pinta()},
  cerrar(){this.abierto=false;$('#wk').hidden=true;if(this.rec)this.para(true);this.pinta()},
  init(){
    $('#wkFab').onclick=()=>this.abrir();$('#wkCerrar').onclick=()=>this.cerrar();$('#wkFondo').onclick=()=>this.cerrar();
    const mandar=()=>{const i=$('#wkTxt'),t=i.value.trim();if(!t||this.noPuede())return;accion('chat',{txt:t});i.value=''};
    $('#wkEnviar').onclick=mandar;$('#wkTxt').onkeydown=e=>{if(e.key==='Enter')mandar()};
    const b=$('#wkPtt');let abajo=0,tocaParar=false;
    b.onpointerdown=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}
      if(this.rec){tocaParar=true;return}abajo=Date.now();this.empieza()};
    const arriba=()=>{
      if(tocaParar){tocaParar=false;this.para(true);return}
      const r=this.rec;if(!r)return;
      if(Date.now()-abajo<350||r.arrancando){r.latch=true;this.btn(true);this.estado('Grabando… toca otra vez para enviar');return}
      if(!r.latch)this.para(true);
    };
    b.onpointerup=arriba;b.onpointercancel=()=>{if(this.rec&&!this.rec.latch&&!this.rec.arrancando)this.para(true)};
    b.oncontextmenu=e=>e.preventDefault();
  }
};

/* ============ acciones de la interfaz ============ */
async function entrar(code,name,crear){
  ME={code,pid:pidPara(code),name};LS.set('imp.pid.'+code,ME.pid);LS.set('imp.ultima',code);
  JOIN_SENT=false;PEND.clear();OPT.clear();PREV=null;OFF=0;OFFS=[];S=null;BUSCA_T=Date.now();HECHAS=new Set();
  if(crear){S=nuevaPartida(ME.pid,name,PERFIL&&PERFIL.look)}
  else{const g=LS.get('imp.st.'+code);if(g&&g.hostId===ME.pid)S=g}
  if(new URLSearchParams(location.search).get('c')!==code){try{history.replaceState(null,'','?c='+code+(location.search.includes('broker=')?'&broker='+encodeURIComponent(BROKERS.join(',')):''))}catch(e){}}
  pinta();await netStart(code);
  if(soyHost()){HECHAS=new Set(S.ackd||[]);publicarEstado(true)}
  despierto();pinta();
}
function salir(){
  if(S&&mine()&&S.phase==='lobby')accion('leave');
  const code=ME.code,cons=NET.cons;setTimeout(()=>{if(NET.cons===cons)netStop()},600);
  ME={code:null,pid:null,name:ME.name};S=null;VISTA='menu';PEND.clear();cerrarSheet();WK.cerrar();LS.del('imp.ultima');
  if(code)LS.del('imp.st.'+code);
  try{history.replaceState(null,'',location.pathname+(location.search.includes('broker=')?'?broker='+encodeURIComponent(BROKERS.join(',')):''))}catch(e){}
  pinta();
}
function cambiaCfg(fn){if(!soyHost())return;const c=JSON.parse(JSON.stringify(S.cfg));fn(c);accion('cfg',{cfg:c})}
const ACT={
  jugar(){WK.ctx();VISTA=CUENTAS&&!USER?'acceso':PERFIL?'menu':'editor';EDIT=null;scrollTo(0,0)},
  modoAcceso(d){ACCESO.modo=d.m;ACCESO.err='';ACCESO.msg=''},
  verClave(){ACCESO.ver=!ACCESO.ver},
  async google(){
    const a=ACCESO;a.err='';a.msg='';a.busy=true;pinta();
    const {error}=await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
    if(error){a.busy=false;a.err=errorCuenta(error);pinta()}},
  async entrarCuenta(){
    const a=ACCESO;a.err='';a.msg='';if(!a.email||!a.pw){a.err='Escribe el correo y la contraseña.';return}
    a.busy=true;pinta();const {error}=await SB.auth.signInWithPassword({email:a.email.trim(),password:a.pw});
    a.busy=false;if(error)a.err=errorCuenta(error);else VISTA='menu';pinta()},
  async crearCuenta(){
    const a=ACCESO;a.err='';a.msg='';if(!a.email||!a.pw){a.err='Escribe el correo y una contraseña.';return}
    if(a.pw.length<6){a.err='La contraseña tiene que tener al menos 6 caracteres.';return}
    a.busy=true;pinta();
    const {data,error}=await SB.auth.signUp({email:a.email.trim(),password:a.pw,options:{emailRedirectTo:location.origin+location.pathname}});
    a.busy=false;
    if(error)a.err=errorCuenta(error);
    else if(!data.session){a.msg='Cuenta creada. Te hemos mandado un correo para confirmarla; ábrelo y vuelve aquí para entrar.';a.modo='entrar';a.pw=''}
    else VISTA='editor';
    pinta()},
  async olvido(){
    const a=ACCESO;a.err='';a.msg='';if(!a.email){a.err='Escribe primero tu correo.';return}
    a.busy=true;pinta();const {error}=await SB.auth.resetPasswordForEmail(a.email.trim(),{redirectTo:location.origin+location.pathname});
    a.busy=false;if(error)a.err=errorCuenta(error);else a.msg='Si hay una cuenta con ese correo, te llegará un enlace para poner una contraseña nueva.';pinta()},
  async nuevaClave(){
    const pw=(($('#pw')||{}).value||'');ACCESO.err='';if(pw.length<6){ACCESO.err='Mínimo 6 caracteres.';return}
    ACCESO.busy=true;pinta();const {error}=await SB.auth.updateUser({password:pw});ACCESO.busy=false;
    if(error)ACCESO.err=errorCuenta(error);else{toast('Contraseña cambiada');VISTA='menu';ACCESO.pw='';ACCESO.ver=false}pinta()},
  async salirCuenta(){if(SB)await SB.auth.signOut();USER=null;PERFIL=null;SES_ID='';EDIT=null;VISTA='portada';pinta()},
  reintentarCuentas(){SB_ESTADO='cargando';SB?SB.auth.getSession().then(r=>trasSesion('INICIO',r.data.session)).then(()=>{SB_ESTADO='listo';pinta()},()=>{SB_ESTADO='error';pinta()}):iniciaCuentas()},
  aPortada(){VISTA='portada';EDIT=null;scrollTo(0,0)},
  aMenu(){VISTA='menu';EDIT=null;scrollTo(0,0)},
  editar(){VISTA='editor';EDIT=null;GIRO='frente';scrollTo(0,0)},
  giro(d){GIRO=d.k},
  look(d){if(!EDIT)return;const i=$('#nom');if(i)EDIT.name=i.value;EDIT.look[d.k]=+d.v;$('#app')._h=''},
  async guardarPerfil(){const n=(($('#nom')||{}).value||'').trim().slice(0,16);if(!n){toast('Escribe un nombre de jugador');$('#nom').focus();return}
    const look=limpiaLook(EDIT.look);
    if(CUENTAS){
      if(!USER){VISTA='acceso';return}
      GUARDANDO=true;pinta();
      const {error}=await SB.from('profiles').upsert({id:USER.id,username:n,look,updated_at:new Date().toISOString()});
      GUARDANDO=false;
      if(error){toast(error.code==='23505'?'Ese nombre ya lo usa otra persona. Elige otro.':errorCuenta(error));pinta();return}
      PERFIL={stats:{p:0,v:0,i:0},...(PERFIL||{}),name:n,look};LS.set('pc.perfil.'+USER.id,PERFIL);
    }else{PERFIL={name:n,look};LS.set('pc.perfil',PERFIL);LS.set('imp.nombre',n)}
    EDIT=null;VISTA='menu';scrollTo(0,0);toast('Personaje guardado');pinta()},
  crear(){if(!PERFIL){VISTA='editor';return}entrar(codigoNuevo(),PERFIL.name,true)},
  unirme(){if(!PERFIL){VISTA='editor';return}const n=PERFIL.name,c=(($('#cod')||{}).value||'').trim().toUpperCase();
    if(c.length!==5){toast('El código tiene 5 letras');$('#cod').focus();return}entrar(c,n,false)},
  volver(d){if(!PERFIL){VISTA='editor';return}entrar(d.c,PERFIL.name,false)},
  salir(){salir()},
  compartir(){const url=location.origin+location.pathname+'?c='+ME.code;const txt=`Únete a mi partida de Punto Ciego con el código ${ME.code}`;
    if(navigator.share)navigator.share({title:'Punto Ciego',text:txt,url}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Enlace copiado'));else toast(url)},
  kick(d){accion('kick',{target:d.p})},
  venue(d){cambiaCfg(c=>{const n=cfgDefecto(d.v,c);Object.assign(c,n)})},
  sala(d){cambiaCfg(c=>{const r=c.rooms.find(x=>x.id===d.r);if(r)r.on=!r.on;const on=c.rooms.filter(x=>x.on);if(!on.some(x=>x.id===c.meet)&&on[0])c.meet=on[0].id})},
  addSala(){const i=$('#nuevaSala'),n=(i.value||'').trim();if(!n){i.focus();return}const t=$('#nuevoTipo').value;i.value='';i.blur();
    cambiaCfg(c=>{if(c.rooms.length>=24)return;c.rooms.push({id:'u'+uid(4),name:n.slice(0,24),type:t,on:true})})},
  sube(d){cambiaCfg(c=>{c[d.k]+=LIM[d.k][2]})},
  baja(d){cambiaCfg(c=>{c[d.k]-=LIM[d.k][2]})},
  tog(d){cambiaCfg(c=>{c[d.k]=!c[d.k]})},
  empezar(){WK.ctx();accion('start')},
  tarea(d){hojaTarea(d.t)},
  empezarJuego(){if(!SHEET)return;const {tid,step,game}=SHEET;(JUEGOS[game]||JUEGOS.hold)($('#juego'),()=>tareaHecha(tid,step))},
  reportar(){const ot=S.players.filter(x=>x.id!==ME.pid);
    abrirSheet(`<h2>¿De quién es el cuerpo?</h2><p class="tenue">Solo si lo tienes delante. Sonará en todos los móviles.</p><div class="rejilla">${ot.map(x=>`<button class="gente-b" data-a="reportarA" data-p="${x.id}">${dot(x)}${esc(x.name)}</button>`).join('')}</div>`)},
  reportarA(d){accion('report',{target:d.p});cerrarSheet()},
  emergencia(){const p=mine();abrirSheet(`<h2>Reunión de emergencia</h2><p class="tenue">Todos tendrán que ir al punto de reunión. Te ${p.emerg===1?'queda 1':'quedan '+p.emerg}.</p><button class="b-alarma b-ancho" data-a="emergOk">Convocar</button>`)},
  emergOk(){accion('emerg');cerrarSheet()},
  menu(){hojaMas()},
  matar(){MODO={m:'matar'}},
  matarA(d){MODO={m:'conf',p:d.p}},
  matarOk(){accion('kill',{target:MODO.p});vibra(40);cerrarSheet()},
  volverMenu(){MODO={m:'menu'}},
  sab(d){if(d.k==='door'){MODO={m:'puerta'};return}accion('sab',{kind:d.k});cerrarSheet()},
  puertaA(d){accion('sab',{kind:'door',room:d.r});cerrarSheet()},
  fix(d){hojaFix(+d.panel||0)},
  votar(d){accion('vote',{target:d.p})},
  verPapel(){ROLVIS=Date.now()<ROLVIS?0:Date.now()+3500},
  revelar(){REVELA=true;vibra(30)},
  entendido(){LS.set('imp.rol.'+S.gid,1);REVELA=false;despierto()},
  terminar(){abrirSheet(`<h2>¿Terminar la partida?</h2><p class="tenue">Se acaba para todos y se muestran los papeles.</p><button class="b-alarma b-ancho" data-a="terminarOk">Terminar</button>`)},
  terminarOk(){accion('end');cerrarSheet()},
  aLobby(){accion('lobby')},
  soy(d){ME.pid=d.p;LS.set('imp.pid.'+ME.code,d.p);pinta()},
  cerrarSheet(){cerrarSheet()},
  wkPlay(d){const v=WK.voces[+d.i];if(v)WK.reproduce(v)}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(EDIT&&$('#nom'))EDIT.name=$('#nom').value;
  if($('#em'))ACCESO.email=$('#em').value;if($('#pw'))ACCESO.pw=$('#pw').value;
  const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset,b);pinta()}
});
addEventListener('pageshow',e=>{if(e.persisted&&ACCESO.busy){ACCESO.busy=false;pinta()}}); /* volver atrás desde Google */
document.addEventListener('change',e=>{const s=e.target.closest('[data-cfg]');if(s)cambiaCfg(c=>{c[s.dataset.cfg]=s.value})});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='cod'){ACT.unirme();pinta()}
  if(e.target.id==='pw'||e.target.id==='em'){const b=document.querySelector('[data-a=entrarCuenta],[data-a=crearCuenta],[data-a=nuevaClave]');if(b&&!b.disabled)b.click()}if(e.target.id==='nuevaSala')ACT.addSala()});
document.addEventListener('pointerdown',()=>{WK.ctx()},{once:true});

WK.init();
(function arranque(){
  const q=(new URLSearchParams(location.search).get('c')||'').toUpperCase();
  const ult=LS.get('imp.ultima');
  precargaFiguras();
  if(CUENTAS){if(q&&q===ult)PEND_ENTRAR=q;pinta();iniciaCuentas();return}
  if(q&&q===ult&&PERFIL){entrar(q,PERFIL.name,false);return}
  pinta();
})();
</script>
