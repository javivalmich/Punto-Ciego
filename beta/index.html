<style>
:root{
  --acero:#0C0C0C; --casco:#161618; --chapa:#202023; --remache:#303035;
  --tiza:#F3EEE6; --niebla:#9C978F; --baliza:#FF4637; --alarma:#FF4637; --sonar:#9CC4D4; --ok:#63C283;
  --disp:Outfit,"Avenir Next",system-ui,sans-serif;
  --txt:Outfit,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--acero);color:var(--tiza);font-family:var(--txt);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1.08;letter-spacing:-.01em}
h2{font-size:24px}
p{margin:.4em 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--remache);background:var(--chapa);color:var(--tiza);border-radius:10px;padding:12px 14px;min-height:48px;font-weight:600;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active:not([disabled]){filter:brightness(1.18)}
button[disabled]{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--baliza);outline-offset:2px}
input,select{background:var(--casco);border:1px solid var(--remache);border-radius:10px;padding:12px;min-height:48px;width:100%}
input::placeholder{color:#63778a}
.b-baliza{background:var(--tiza);border-color:var(--tiza);color:#0C0C0C}
.b-alarma{background:var(--alarma);border-color:var(--alarma);color:#fff}
.av{border-radius:50%;object-fit:cover;object-position:50% 30%;background:#0f0f0f;flex:0 0 auto;display:inline-block;vertical-align:middle}
.pose{display:block;margin:0 auto;height:auto}
img[data-pend]{visibility:hidden}
.v3d{position:relative;display:block;margin:0 auto;flex:0 0 auto}
.v3d canvas,.v3d .ph{position:absolute;left:0;top:0;width:100%;height:100%}
.v3d .ph{object-fit:contain}.v3d.ok .ph{display:none}
.v3d canvas{touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.v3d canvas[data-drag]{cursor:grab}.v3d canvas[data-drag]:active{cursor:grabbing}
.v3d canvas:focus-visible{outline:2px solid var(--baliza);outline-offset:2px;border-radius:12px}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.05,.94)}45%{transform:translateY(-16px) scale(.98,1.03)}}
.pose.espectro{animation:flota 2.6s ease-in-out infinite}
.pose.espectro:not([data-d3]){opacity:.65}
.pose.hop{animation:hop .85s ease-in-out infinite;transform-origin:50% 100%}
.pose[data-d3].rojo,.pose[data-d3].gris{filter:none}
.ed-tip{margin:0;text-align:center;font-size:13px;color:var(--niebla)}
.pose.rojo{filter:drop-shadow(0 0 18px rgba(255,70,55,.55)) saturate(1.1)}
.pose.gris{filter:grayscale(1) brightness(.7)}
.mira{display:block}
.b-ancho{display:block;width:100%}
.b-link{background:none;border:0;color:var(--niebla);text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:8px 0;font-weight:500}
.b-mini{min-height:34px;padding:4px 10px;font-size:14px;margin-left:auto;background:transparent}
.tenue{color:var(--niebla)}
.lbl{display:block;color:var(--niebla);font-size:14px;margin:0 0 6px}
.fila{display:flex;gap:8px}
.fila input{flex:1;min-width:0}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--acero);border-bottom:1px solid var(--remache)}
.tb{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px}
.marca{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:.06em;display:flex;align-items:center;gap:1px}
.marca i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--tiza);margin:0 5px 0 1px;position:relative}
.marca i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--baliza)}
.tb-cod{font-family:var(--disp);font-size:15px;color:var(--niebla);letter-spacing:.18em;font-weight:600}
.red{width:9px;height:9px;border-radius:50%;background:var(--alarma);flex:0 0 auto}
.red.ok{background:var(--ok)}
.yo{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:600;max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);flex:0 0 auto}

main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
.bloque{margin:18px 0}
.bloque.o{padding-top:18px;border-top:1px solid var(--remache)}

.hero{margin:0 -16px 6px;padding:0 16px;text-align:center}
.hero .logo{width:min(100%,380px);height:auto;display:block;margin:0 auto}
.lema{font-size:16.5px;max-width:34ch;color:#cfc9bf;margin:4px auto 0}
.in-cod{font-family:var(--disp);font-size:24px;letter-spacing:.3em;text-transform:uppercase}

details.reglas{margin:22px 0;border-top:1px solid var(--remache);padding-top:10px}
details.reglas summary{cursor:pointer;font-family:var(--disp);font-size:21px;font-weight:700;padding:6px 0;list-style:none}
details.reglas summary::after{content:" +";color:var(--baliza)}
details[open].reglas summary::after{content:" −"}
.reglas p{color:#c7d1da;max-width:62ch}

.codigo{text-align:center;padding:10px 0 18px;border-bottom:1px solid var(--remache)}
.cod-grande{display:flex;justify-content:center;gap:8px;margin:6px 0 14px}
.cod-grande span{font-family:var(--disp);font-weight:800;font-size:42px;width:52px;height:64px;display:grid;place-items:center;background:var(--casco);border:1px solid var(--remache);border-bottom:3px solid var(--baliza);border-radius:8px}
.b-sec{background:transparent}

ul.gente{list-style:none;margin:10px 0 0;padding:0}
ul.gente li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--remache)}
ul.gente li:first-child{border-top:0}
ul.gente em{font-style:normal;color:var(--niebla);font-size:13.5px}

.sitios{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sitio{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;font-weight:500;background:var(--casco)}
.sitio b{font-family:var(--disp);font-size:19px}
.sitio small{color:var(--niebla);font-size:13px;line-height:1.3}
.sitio.on{border-color:var(--baliza);box-shadow:inset 0 0 0 1px var(--baliza);background:#241312}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{min-height:38px;padding:6px 12px;border-radius:999px;font-weight:500;font-size:14.5px;background:transparent;color:var(--niebla)}
.chip.on{background:var(--tiza);border-color:var(--tiza);color:var(--acero)}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.add select{grid-column:1/2}
.add button{grid-row:1/3;grid-column:2}
.paso{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--remache)}
.paso:first-of-type{border-top:0}
.paso .ctl{display:flex;align-items:center;gap:6px}
.paso .ctl b{min-width:58px;text-align:center;font-family:var(--disp);font-size:20px}
.paso .ctl button{width:44px;min-height:44px;padding:0;font-size:20px}
.tog{min-width:74px;min-height:40px;padding:4px 10px;border-radius:999px}
.tog.on{background:var(--ok);border-color:var(--ok);color:#0d2416}
.motivo{color:var(--baliza);font-size:14.5px;margin:8px 0}

.barra-t{margin:4px 0 14px}
.bt-cab{display:flex;justify-content:space-between;font-size:14px;color:var(--niebla)}
.bt-cab b{color:var(--tiza);font-family:var(--disp);font-size:18px}
.bt{height:12px;background:var(--casco);border:1px solid var(--remache);border-radius:3px;overflow:hidden;margin-top:4px}
.bt i{display:block;height:100%;background:var(--ok);transition:width .6s ease}
.rol-b{display:block;width:100%;text-align:left;background:var(--casco);font-weight:500;color:var(--niebla)}
.rol-b.ver{color:var(--tiza)}
.rol-b.ver.imp{border-color:var(--alarma);background:#2a1110}
.rol-b.ver b{font-family:var(--disp);font-size:22px}
.fantasma{border:1px dashed var(--sonar);color:var(--sonar);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}

.alerta{margin:12px 0;border-radius:10px;overflow:hidden;background:#221110;border:1px solid var(--alarma);border-top-width:4px}
.alerta .in{padding:12px}
.alerta h3{font-size:26px;display:flex;justify-content:space-between;gap:10px}
.alerta h3 span{color:var(--baliza)}
.alerta .fila{margin-top:8px;flex-wrap:wrap}
.alerta .fila button{flex:1;min-width:140px}
.panel-est{font-size:14px;color:var(--niebla);margin:2px 0}
.cerrada{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--casco);border-left:4px solid var(--baliza);font-size:15px}

ul.tareas{list-style:none;margin:6px 0;padding:0;display:grid;gap:8px}
.tarea{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--casco);padding:12px 14px;font-weight:400}
.t-sala{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--baliza)}
.t-txt{grid-column:1/2;color:#d3dbe2}
.t-parte{grid-column:2;grid-row:1;font-size:13px;color:var(--niebla);align-self:center}
.tarea.hecha{opacity:.5}
.tarea.hecha .t-sala{color:var(--ok)}
.tarea.hecha .t-txt{text-decoration:line-through}
.coms{margin:14px 0;padding:16px;border-radius:10px;background:repeating-linear-gradient(0deg,#1f2c38 0 3px,#243341 3px 6px);color:var(--niebla);text-align:center}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--casco);border-top:1px solid var(--remache);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.barra{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:8px}
.barra button{padding:10px 8px}

.apagon{position:fixed;inset:0;z-index:20;background:#05080b;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:24px}
.apagon h2{font-size:44px;color:#4a5866}
.apagon p{color:#5d6d7c;max-width:28ch}

#over{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--acero)}
.ov{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(110px + env(safe-area-inset-bottom,0px));min-height:100%}
.ov-franja{height:3px;background:var(--baliza);margin:0 -18px 18px}
.ov .pose,.ov .v3d{margin:4px auto 6px}
.ov h1{font-size:clamp(46px,14vw,72px);font-weight:800}
.ov .sub{font-size:18px;color:#c7d1da}
.ov .fase{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;font-family:var(--disp);font-size:24px;font-weight:700}
.ov .fase b{color:var(--baliza);font-size:30px}
.dondes{margin:14px 0;padding:12px 14px;border-radius:10px;background:var(--casco);font-size:17px}
.dondes b{color:var(--baliza)}
.votos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.voto{display:flex;align-items:center;gap:10px;text-align:left;background:var(--casco);min-height:56px;padding:10px 14px;border:1px solid var(--remache);border-radius:10px;font-weight:600}
.voto.muerto{opacity:.35;text-decoration:line-through}
.voto .n{margin-left:auto;font-family:var(--disp);font-size:20px;color:var(--baliza)}
.salta{grid-column:1/-1;background:transparent}
.ov-muerto{background:#1a0808;min-height:100vh}
.ov-muerto h1{color:#ff8f86}
.revela{margin-top:26px;border-radius:14px;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;padding:22px;border:1px solid var(--remache);background:var(--casco);width:100%}
.revela.tapa{background:var(--casco);border:1px dashed var(--remache)}
.revela.tapa span{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:.02em}
.mira-caja{position:relative;width:210px;height:210px}
.mira-caja .mira{position:absolute;inset:0}
.mira-caja .pose{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px}
.revela h1{font-size:60px}
.revela.imp{background:#1f0d0c;border-color:var(--alarma)}
.revela.imp h1{color:#ff8f86}
.fin-w{font-size:clamp(50px,15vw,84px)}
.fin-w.imp{color:#ff8f86}
.fin-w.crew{color:var(--ok)}
.roles li{justify-content:flex-start}
.roles .imp{color:#ff8f86;font-weight:600}
.log{font-size:14px;color:var(--niebla)}

#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.sh-fondo{position:absolute;inset:0;background:rgba(5,8,12,.65)}
.sh-caja{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--acero);border-top:3px solid var(--tiza);border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
#shBody{max-width:560px;margin:0 auto}
.sh-sala{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--baliza);margin:0}
.sh-caja h2{margin:4px 0 6px;font-size:28px}
.sh-cerrar{position:absolute;right:12px;top:10px;min-height:40px;width:40px;padding:0;background:transparent;border:0;font-size:20px;color:var(--niebla)}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.gente-b{display:flex;align-items:center;gap:10px;text-align:left;background:var(--casco);font-weight:600}
.opc{display:block;width:100%;text-align:left;margin:8px 0;background:var(--casco);font-weight:400}
.opc b{display:block;font-family:var(--disp);font-size:20px}
.opc small{color:var(--niebla)}
.info-salas{margin-top:18px;padding-top:12px;border-top:1px solid var(--remache);font-size:15px;color:var(--niebla)}
.info-salas b{color:var(--tiza)}

#juego{margin-top:14px}
.g-ayuda{color:var(--niebla);font-size:15px}
.g-rej{display:grid;gap:8px;margin:10px auto;max-width:330px}
.g3{grid-template-columns:repeat(3,1fr)}
.g-c{aspect-ratio:1;min-height:0;font-family:var(--disp);font-size:26px;background:var(--casco);transition:background .12s}
.g-c.on{background:var(--tiza);border-color:var(--tiza)}
.g-c.hecho{background:var(--ok);border-color:var(--ok);color:#0d2416}
.g-c.mal,.g-n.mal{background:var(--alarma)!important}

async function claves(code){
  const te=new TextEncoder();
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode('impostor-irl/'+code)));
  const topic='impirl2/'+[...h.slice(0,10)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const base=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('impostor-irl-sal'),iterations:60000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  return {topic,key};
}
async function cifra(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},NET.key,new TextEncoder().encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out;
}
async function descifra(buf){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},NET.key,buf.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

  do{let d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d)}while(len>0);
  const out=new Uint8Array(1+lb.length+tot);out[0]=h;out.set(lb,1);let o=1+lb.length;
  for(const p of parts){out.set(p,o);o+=p.length}return out;
}

  constructor(url,onMsg,onState){
    const m=url.match(/^(wss?:\/\/)([^:@\/]+):([^@\/]+)@(.*)$/);

  connect(){

  const b=prev?{...prev}:{imp:1,tasks:4,killCd:30,disc:60,vote:45,emerg:1,confirm:true,walkie:true};

    if(!pool.length)pool=TAREAS.generica.map((t,i)=>[t,'g'+i]).filter(x=>!usadas.has(r.id+x[1]));

      st.phase='play';st.players.forEach(p=>{if(p.role==='imp')p.kcd=now+st.cfg.killCd*1000});
      st.sabCd=Math.max(st.sabCd,now+15000);ganador(st,now);ch=true;
    }
  }
  return ch;
}

/* ============ modo pruebas: bots ============
   Solo existe con ?pruebas=1. Los bots viven en el navegador del anfitrión: generan acciones con sus propios ids
   (bot-1, bot-2…) y el anfitrión las aplica con el mismo reducer que las de los jugadores reales (aplicar), así que
   cumplen las mismas reglas. Si el anfitrión se desconecta, los bots se paran; nadie los hereda. */
const BOT_NOMBRES=['Ana','Luis','Marta','Pablo','Lucía','Hugo','Sara','Diego','Noa','Álex','Irene','Mateo','Carla','Iván','Elena'];
const BOT_VEL={lenta:2,normal:1,rapida:.4}; /* multiplica todas las esperas */
let BOT={gid:'',mem:{},rep:null};
const esBot=p=>!!(p&&p.bot);
const bots=()=>S?S.players.filter(esBot):[];
const entre=(a,b)=>a+Math.random()*(b-a);
const elige=a=>a[Math.floor(Math.random()*a.length)];
const velBots=()=>BOT_VEL[(S&&S.pr&&S.pr.vel)||'normal']||1;
const bt=p=>esBot(p)?'<span class="bot-tag">bot</span>':'';
const enPruebas=()=>!!(PRUEBAS&&S&&S.pruebas&&soyHost());
function botAccion(pid,t,data){aplicar({id:uid(12),pid,t,...data},true)}
function botAnade(){
  if(!enPruebas()||S.phase!=='lobby'||S.players.length>=15)return;
  let n=1;while(S.players.some(p=>p.id==='bot-'+n))n++;
  const usados=new Set(S.players.map(p=>p.name.toLowerCase())),r=k=>Math.floor(Math.random()*k);
  const nombre='Bot '+(BOT_NOMBRES.find(x=>!usados.has('bot '+x.toLowerCase()))||n);
  const look=limpiaLook({hood:r(COLORES.length),cloth:r(ROPA.length),pat:Math.random()<.6?0:1+r(ESTAMPADOS.length-1),glove:r(GUANTES.length),eye:r(OJOS.length),pants:r(PIEZAS.length),pack:r(PIEZAS.length)});
  botAccion('bot-'+n,'join',{name:nombre,look,bot:true});
}
function botsQuita(){if(enPruebas())for(const b of bots())accion('kick',{target:b.id})}
/* a quién vota un bot: al azar, saltar, o con más probabilidad quien encontró el cuerpo o estaba cerca de él */
function botElige(p,m){
  const ok=S.players.filter(x=>!x.dead&&x.id!==p.id&&!(p.role==='imp'&&x.role==='imp'));
  if(!ok.length)return 'skip';
  const r=Math.random(),cad=m.body&&P(S,m.body);
  if(cad){
    const sosp=ok.filter(x=>x.id===cad.killer||x.id===m.by);
    if(r<.5&&sosp.length)return elige(sosp).id;
    return r<.8?elige(ok).id:'skip';
  }
  return r<.55?elige(ok).id:'skip';
}
function botsVotan(now,v,ya){
  const m=S.meet;if(!m||m.fase!=='vote')return;
  const total=S.cfg.vote*1000,ini=m.until-total;
  for(const b of bots()){
    if(!S.meet||S.phase!=='meeting'||S.meet.fase!=='vote')return;
    const p=P(S,b.id);if(p.dead||(p.id in m.votes))continue;
    const mm=BOT.mem[p.id]||(BOT.mem[p.id]={});
    if(mm.voto!==m.n){mm.voto=m.n;mm.votoAt=Math.min(ini+entre(2500,Math.max(3000,total*.7))*v,m.until-1500)}
    if(ya||now>=mm.votoAt)botAccion(p.id,'vote',{target:botElige(p,m)});
  }
}
function botsRepara(now,v){
  const s=S.sab;if(!s){BOT.rep=null;return}
  const key=s.kind+'|'+s.rooms.join()+'|'+S.sabCd,cr=S.players.filter(x=>esBot(x)&&x.role==='crew'&&!x.dead);
  if(!BOT.rep||BOT.rep.key!==key){
    const plan=[];
    if(s.kind==='gas'){ /* dos bots distintos, casi a la vez, para que se pueda resolver */
      if(cr.length&&Math.random()<.75){
        const o=barajar(cr.slice()),at=now+Math.min(entre(6000,18000)*v,30000);
        plan.push({id:o[0].id,at,panel:0});if(o[1])plan.push({id:o[1].id,at:at+entre(800,2500),panel:1});
      }
    }else cr.forEach(b=>{if(Math.random()<.55)plan.push({id:b.id,at:now+entre(5000,20000)*v,panel:0})});
    BOT.rep={key,plan};
  }
  const rep=BOT.rep;
  if(s.kind==='gas'){ /* si una persona repara un panel, un bot ayuda en el otro */
    const fs=[0,1].filter(i=>s.fix[i]);
    if(fs.length===1&&!rep.ayuda){
      const f=s.fix[fs[0]],ayu=cr.find(x=>x.id!==f.pid);
      if(ayu&&!esBot(P(S,f.pid))){rep.ayuda=true;rep.plan.push({id:ayu.id,at:now+entre(1000,4000),panel:1-fs[0]})}
    }else if(!fs.length)rep.ayuda=false;
  }
  for(const it of rep.plan){
    if(it.hecho||now<it.at)continue;it.hecho=true;
    const p=P(S,it.id);if(!p||p.dead||!S.sab)continue;
    botAccion(it.id,'fix',{panel:it.panel});
  }
}
function botsJuego(now,v){
  botsRepara(now,v);
  for(const b of bots()){
    if(S.phase!=='play')return;
    const p=P(S,b.id),mm=BOT.mem[p.id]||(BOT.mem[p.id]={});
    if(p.role==='crew'){
      if(!mm.tarea)mm.tarea=now+entre(20000,50000)*v;
      if(now>=mm.tarea){
        mm.tarea=now+entre(20000,50000)*v;
        const ciego=!p.dead&&S.sab&&(S.sab.kind==='coms'||S.sab.kind==='luces'); /* sin ver el móvil no hay tareas */
        const pend=ciego?[]:(p.tasks||[]).filter(t=>t.done<t.steps.length&&!cerrada(t.steps[t.done].room));
        if(pend.length){const t=elige(pend);botAccion(p.id,'task',{tid:t.id,step:t.done})}
      }
      const cad=!p.dead&&S.phase==='play'&&S.players.find(x=>x.body);
      if(cad){
        if(mm.repDe!==cad.id){mm.repDe=cad.id;mm.rep=Math.random()<.7?now+entre(4000,18000)*v:0}
        if(mm.rep&&now>=mm.rep){mm.rep=0;botAccion(p.id,'report',{target:cad.id})}
      }
    }else if(p.role==='imp'&&!p.dead){
      if(now>=p.kcd){
        if(!mm.mata)mm.mata=now+entre(3000,15000)*v;
        if(now>=mm.mata){
          mm.mata=0;
          const vic=S.players.filter(x=>!x.dead&&x.role!=='imp');
          if(vic.length&&Math.random()<.7)botAccion(p.id,'kill',{target:elige(vic).id});
        }
      }
      if(S.phase==='play'&&now>=S.sabCd){
        if(!mm.sab)mm.sab=now+entre(8000,35000)*v;
        if(now>=mm.sab){
          mm.sab=0;
          if(Math.random()<.45){const k=elige(S.sab?['door']:['gas','luces','coms','door']);botAccion(p.id,'sab',k==='door'?{kind:k,room:elige(salas(S)).id}:{kind:k})}
        }
      }
    }
  }
}
function botsTick(){
  if(!enPruebas())return;
  if(BOT.gid!==S.gid)BOT={gid:S.gid,mem:{},rep:null};
  const now=ahora(),v=velBots();
  if(S.phase==='play')botsJuego(now,v);
  else if(S.phase==='meeting')botsVotan(now,v,false);
}
setInterval(botsTick,500);
/* atajos: forzar cosas sin esperar. Siguen pasando por el reducer (acción 'atajo' + acciones normales de los bots) */
let ATJ='menu';
const impVivo=()=>S.players.find(x=>x.role==='imp'&&!x.dead&&(esBot(x)||x.id===ME.pid));
function atajoMata(id){

function atajoSab(kind,room){

function atajoVotar(){

function atajoTareas(){

}
function vAtajos(){
  if(!S||!S.pruebas)return '';

  if(ATJ==='puerta'){

  else{

  }

  h+=opc('atajoTareas','Completar todas las tareas de los bots',jug&&bs.some(b=>b.role==='crew'));
  return h;
}

/* ============ red de la partida ============ */
function publicarEstado(bump){
  if(!S||!soyHost())return;
  if(bump)S.v++;S.hb=ahora();
  const me=mine();if(me)me.seen=S.hb;
  LS.set('imp.st.'+ME.code,S);
  if(Date.now()<HOST_PAUSA)return;
  enviar('s',S,true);
}
function mejor(st,cur){
  if(!cur)return true;
  if(st.v>cur.v)return true;
  return st.v===cur.v&&st.hostId===cur.hostId&&st.hb>cur.hb;
}
function recibeEstado(st){
  if(!st||!Array.isArray(st.players))return;
  if(!mejor(st,S))return;
  const eraHost=soyHost(),otroHost=!S||S.hostId!==st.hostId;
  S=st;
  if(S.hostId===ME.pid){if(!eraHost)HECHAS=new Set(S.ackd||[])}
  else{
    if(otroHost)OFFS=[];
    OFFS.push(st.hb-Date.now());if(OFFS.length>12)OFFS.shift();OFF=Math.max(...OFFS);
  }
  for(const id of PEND.keys())if((S.ackd||[]).includes(id))PEND.delete(id);
  for(const k of [...OPT]){const [tid,step]=k.split(':');const t=mine()&&(mine().tasks||[]).find(x=>x.id===tid);if(!t||t.done>+step)OPT.delete(k)}
  if(!mine()&&S.phase==='lobby'&&!JOIN_SENT&&ME.name){JOIN_SENT=true;accion('join',{name:ME.name,look:PERFIL?PERFIL.look:LOOK0})}
  LS.set('imp.st.'+ME.code,S);
  eventos();pinta();
}
function recibeAccion(a){
  if(!soyHost()||!a||!a.id||HECHAS.has(a.id))return;
  if(String(a.pid).startsWith('bot-'))return; /* los bots solo los genera el propio anfitrión; nadie puede hacerse pasar por uno */
  aplicar(a,false);
}
function aplicar(a,local){
  HECHAS.add(a.id);
  const pub=reducir(S,a,ahora(),!!local);
  if(a.t==='ping'||pub===false)return;
  S.ackd=[...(S.ackd||[]).slice(-90),a.id];
  publicarEstado(true);eventos();pinta();
}
function accion(t,data={}){
  const a={id:uid(12),pid:ME.pid,t,...data};
  if(soyHost()){aplicar(a,true);return}
  PEND.set(a.id,{a,n:0});enviar('a',a);
}
setInterval(()=>{
  for(const [id,p] of PEND){if(++p.n>25){PEND.delete(id);continue}if(p.n%2===0)enviar('a',p.a)}
},1000);
setInterval(()=>{if(S&&mine()&&!soyHost())enviar('a',{id:uid(12),pid:ME.pid,t:'ping'})},8000);
setInterval(()=>{if(soyHost()&&tick(S,ahora())){publicarEstado(true);eventos()}},400);

setInterval(()=>{ /* si el anfitrión desaparece, otro coge el mando */
  if(!S||soyHost()||!NET.key||!mine())return;
  const stale=ahora()-S.hb;if(stale<15000)return;
  const cand=S.players.filter(p=>!p.bot&&p.id!==S.hostId&&ahora()-(p.seen||0)<60000).map(p=>p.id).sort();
  let r=cand.indexOf(ME.pid);if(r<0)r=cand.length;
  if(stale>15000+r*8000){S.hostId=ME.pid;S.v+=10;HECHAS=new Set(S.ackd||[]);publicarEstado(true);toast('El anfitrión se ha desconectado: ahora llevas tú la partida');pinta()}
},1000);

/* ============ sonidos y avisos ============ */
function tono(seq){
  const c=WK.ctx();if(!c)return;let t=c.currentTime+0.02;
  for(const [f,d,type='square',v=0.1] of seq){
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.03);t+=d;
  }
}
const SON={
  reunion:()=>tono([[880,.16],[620,.16],[880,.16],[620,.16],[880,.3]]),
  sabotaje:()=>tono([[230,.32,'sawtooth',.12],[170,.32,'sawtooth',.12],[230,.32,'sawtooth',.12],[170,.4,'sawtooth',.12]]),
  muerte:()=>tono([[150,.45,'sine',.35],[80,.7,'sine',.35]]),
  tarea:()=>tono([[660,.08,'triangle',.15],[990,.16,'triangle',.15]]),
  fin:()=>tono([[523,.14,'triangle',.18],[659,.14,'triangle',.18],[784,.34,'triangle',.18]])
};
function eventos(){
  if(!S||!ME.pid)return;const p=mine(),pr=PREV;
  PREV={phase:S.phase,mn:S.meet?S.meet.n:0,sab:S.sab?S.sab.kind+S.sab.rooms.join():'',dead:!!(p&&p.dead),gid:S.gid,notice:S.notice?S.notice.t:0};
  if(pr&&pr.gid!==S.gid&&S.phase!=='lobby'){if(WK.abierto)WK.cerrar();cerrarSheet()}

  if(S.phase==='meeting'&&pr.mn!==PREV.mn){SON.reunion();vibra([300,120,300,120,300]);cerrarSheet();if(WK.abierto)WK.cerrar()}
  if(PREV.sab&&PREV.sab!==pr.sab&&p&&p.role!=='imp'){SON.sabotaje();vibra([500,200,500])}
  if(p&&PREV.dead&&!pr.dead&&S.phase==='play'){SON.muerte();vibra(900);cerrarSheet()}

}

        setTimeout(()=>{if(!el.isConnected)return;cs[seq[k]].classList.add('on');k++;setTimeout(paso,430)},170)};setTimeout(paso,500)};
    cs.forEach(c=>c.onclick=()=>{if(bloq)return;const i=+c.dataset.i;c.classList.add('on');setTimeout(()=>c.classList.remove('on'),160);

  kick(d){accion('kick',{target:d.p})},
  venue(d){cambiaCfg(c=>{const n=cfgDefecto(d.v,c);Object.assign(c,n)})},
  sala(d){cambiaCfg(c=>{const r=c.rooms.find(x=>x.id===d.r);if(r)r.on=!r.on;const on=c.rooms.filter(x=>x.on);if(!on.some(x=>x.id===c.meet)&&on[0])c.meet=on[0].id})},
  addSala(){const i=$('#nuevaSala'),n=(i.value||'').trim();if(!n){i.focus();return}const t=$('#nuevoTipo').value;i.value='';i.blur();
    cambiaCfg(c=>{if(c.rooms.length>=24)return;c.rooms.push({id:'u'+uid(4),name:n.slice(0,24),type:t,on:true})})},
  sube(d){cambiaCfg(c=>{c[d.k]+=LIM[d.k][2]})},
  baja(d){cambiaCfg(c=>{c[d.k]-=LIM[d.k][2]})},
  tog(d){cambiaCfg(c=>{c[d.k]=!c[d.k]})},
  empezar(){WK.ctx();accion('start')},
  tarea(d){hojaTarea(d.t)},
  empezarJuego(){if(!SHEET)return;const {tid,step,game}=SHEET;(JUEGOS[game]||JUEGOS.hold)($('#juego'),()=>tareaHecha(tid,step))},
  reportar(){const ot=S.players.filter(x=>x.id!==ME.pid);
    abrirSheet(`<h2>¿De quién es el cuerpo?</h2><p class="tenue">Solo si lo tienes delante. Sonará en todos los móviles.</p><div class="rejilla">${ot.map(x=>`<button class="gente-b" data-a="reportarA" data-p="${x.id}">${dot(x)}${esc(x.name)}${bt(x)}</button>`).join('')}</div>`)},
  reportarA(d){accion('report',{target:d.p});cerrarSheet()},
  emergencia(){const p=mine();abrirSheet(`<h2>Reunión de emergencia</h2><p class="tenue">Todos tendrán que ir al punto de reunión. Te ${p.emerg===1?'queda 1':'quedan '+p.emerg}.</p><button class="b-alarma b-ancho" data-a="emergOk">Convocar</button>`)},
  emergOk(){accion('emerg');cerrarSheet()},
  menu(){hojaMas()},
  matar(){MODO={m:'matar'}},
  matarA(d){MODO={m:'conf',p:d.p}},
  matarOk(){accion('kill',{target:MODO.p});vibra(40);cerrarSheet()},
  volverMenu(){MODO={m:'menu'}},
  sab(d){if(d.k==='door'){MODO={m:'puerta'};return}accion('sab',{kind:d.k});cerrarSheet()},
  puertaA(d){accion('sab',{kind:'door',room:d.r});cerrarSheet()},
  fix(d){hojaFix(+d.panel||0)},
  votar(d){accion('vote',{target:d.p})},
  verPapel(){ROLVIS=Date.now()<ROLVIS?0:Date.now()+3500},
  revelar(){REVELA=true;vibra(30)},
  entendido(){LS.set('imp.rol.'+S.gid,1);REVELA=false;despierto()},
  terminar(){abrirSheet(`<h2>¿Terminar la partida?</h2><p class="tenue">Se acaba para todos y se muestran los papeles.</p><button class="b-alarma b-ancho" data-a="terminarOk">Terminar</button>`)},
  terminarOk(){accion('end');cerrarSheet()},
  aLobby(){accion('lobby')},
  soy(d){ME.pid=d.p;LS.set('imp.pid.'+ME.code,d.p);pinta()},
  cerrarSheet(){cerrarSheet()},
  wkPlay(d){const v=WK.voces[+d.i];if(v)WK.reproduce(v)},
  /* modo pruebas: cada acción comprueba que de verdad lo es */
  botMas(){botAnade()},
  botQuita(){botsQuita()},
  prRol(d){if(enPruebas())accion('pruebas',{rol:d.v})},
  prVel(d){if(enPruebas())accion('pruebas',{vel:d.v})},
  atajos(){if(!enPruebas())return;ATJ='menu';abrirSheet('<div id="shVivo"></div>',{refresh:vAtajos});setHTML($('#shVivo'),vAtajos())},
  atajoVolver(){ATJ='menu'},
  atajoReunion(){if(enPruebas()&&S.phase==='play'){accion('atajo',{k:'reunion'});cerrarSheet()}},
  atajoDebate(){if(enPruebas())accion('atajo',{k:'debate'})},
  atajoVotar(){if(enPruebas())atajoVotar()},
  atajoMata(d){if(enPruebas())atajoMata(d.p)},
  atajoSab(d){if(!enPruebas())return;if(d.k==='door'){ATJ='puerta';return}atajoSab(d.k)},
  atajoPuertaA(d){if(enPruebas()){atajoSab('door',d.r);ATJ='menu'}},
  atajoTareas(){if(enPruebas())atajoTareas()}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(EDIT&&$('#nom'))EDIT.name=$('#nom').value;
  if($('#em'))ACCESO.email=$('#em').value;if($('#pw'))ACCESO.pw=$('#pw').value;
  const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset,b);pinta()}
});
addEventListener('pageshow',e=>{if(e.persisted&&ACCESO.busy){ACCESO.busy=false;pinta()}}); /* volver atrás desde Google */
document.addEventListener('change',e=>{const s=e.target.closest('[data-cfg]');if(s)cambiaCfg(c=>{c[s.dataset.cfg]=s.value})});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='cod'){ACT.unirme();pinta()}
  if(e.target.id==='pw'||e.target.id==='em'){const b=document.querySelector('[data-a=entrarCuenta],[data-a=crearCuenta],[data-a=nuevaClave]');if(b&&!b.disabled)b.click()}if(e.target.id==='nuevaSala')ACT.addSala()});
document.addEventListener('pointerdown',()=>{WK.ctx()},{once:true});

WK.init();
if(PRUEBAS){const f=document.createElement('button');f.id='prFab';f.hidden=true;f.textContent='⚡ Atajos';f.dataset.a='atajos';document.body.appendChild(f)}
(function arranque(){
  const q=(new URLSearchParams(location.search).get('c')||'').toUpperCase();
  const ult=LS.get('imp.ultima');
  if(CUENTAS){if(q&&q===ult)PEND_ENTRAR=q;pinta();iniciaCuentas();return}
  if(q&&q===ult&&PERFIL){entrar(q,PERFIL.name,false);return}
  pinta();
})();
